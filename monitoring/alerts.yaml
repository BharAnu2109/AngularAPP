# Cloud Monitoring Alert Policies

# High Error Rate Alert
- displayName: "High Error Rate - Trading Backend"
  conditions:
    - displayName: "Error rate exceeds 5%"
      conditionThreshold:
        filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="trading-backend" AND metric.type="run.googleapis.com/request_count" AND metric.labels.response_code_class="5xx"'
        comparison: COMPARISON_GT
        thresholdValue: 0.05
        duration: 60s
        aggregations:
          - alignmentPeriod: 60s
            perSeriesAligner: ALIGN_RATE
  notificationChannels: []
  alertStrategy:
    autoClose: 604800s

# High Latency Alert  
- displayName: "High Latency - Trading Backend"
  conditions:
    - displayName: "95th percentile latency exceeds 1s"
      conditionThreshold:
        filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="trading-backend" AND metric.type="run.googleapis.com/request_latencies"'
        comparison: COMPARISON_GT
        thresholdValue: 1000
        duration: 300s
        aggregations:
          - alignmentPeriod: 60s
            perSeriesAligner: ALIGN_PERCENTILE_95

# CPU Utilization Alert
- displayName: "High CPU Utilization"
  conditions:
    - displayName: "CPU utilization exceeds 80%"
      conditionThreshold:
        filter: 'resource.type="cloud_run_revision" AND metric.type="run.googleapis.com/container/cpu/utilizations"'
        comparison: COMPARISON_GT
        thresholdValue: 0.8
        duration: 300s
        aggregations:
          - alignmentPeriod: 60s
            perSeriesAligner: ALIGN_MEAN

# Memory Utilization Alert
- displayName: "High Memory Utilization"
  conditions:
    - displayName: "Memory utilization exceeds 90%"
      conditionThreshold:
        filter: 'resource.type="cloud_run_revision" AND metric.type="run.googleapis.com/container/memory/utilizations"'
        comparison: COMPARISON_GT
        thresholdValue: 0.9
        duration: 300s
        aggregations:
          - alignmentPeriod: 60s
            perSeriesAligner: ALIGN_MEAN
