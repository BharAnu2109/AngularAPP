apiVersion: apps/v1
kind: Deployment
metadata:
  name: vue-frontend
  labels:
    app: vue-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vue-frontend
  template:
    metadata:
      labels:
        app: vue-frontend
    spec:
      containers:
      - name: vue-frontend
        image: gcr.io/YOUR_PROJECT_ID/vue-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: vue-frontend-service
  labels:
    app: vue-frontend
spec:
  type: LoadBalancer
  selector:
    app: vue-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
