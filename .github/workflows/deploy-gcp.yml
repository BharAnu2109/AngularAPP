name: Deploy to GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and Push Backend
        run: |
          docker build -t gcr.io/$PROJECT_ID/trading-backend:$GITHUB_SHA ./backend
          docker push gcr.io/$PROJECT_ID/trading-backend:$GITHUB_SHA
          docker tag gcr.io/$PROJECT_ID/trading-backend:$GITHUB_SHA gcr.io/$PROJECT_ID/trading-backend:latest
          docker push gcr.io/$PROJECT_ID/trading-backend:latest

      - name: Build and Push Angular Frontend
        run: |
          docker build -t gcr.io/$PROJECT_ID/angular-frontend:$GITHUB_SHA ./angular-frontend
          docker push gcr.io/$PROJECT_ID/angular-frontend:$GITHUB_SHA
          docker tag gcr.io/$PROJECT_ID/angular-frontend:$GITHUB_SHA gcr.io/$PROJECT_ID/angular-frontend:latest
          docker push gcr.io/$PROJECT_ID/angular-frontend:latest

      - name: Build and Push React Frontend
        run: |
          docker build -t gcr.io/$PROJECT_ID/react-frontend:$GITHUB_SHA ./react-frontend
          docker push gcr.io/$PROJECT_ID/react-frontend:$GITHUB_SHA
          docker tag gcr.io/$PROJECT_ID/react-frontend:$GITHUB_SHA gcr.io/$PROJECT_ID/react-frontend:latest
          docker push gcr.io/$PROJECT_ID/react-frontend:latest

      - name: Build and Push Vue Frontend
        run: |
          docker build -t gcr.io/$PROJECT_ID/vue-frontend:$GITHUB_SHA ./vue-frontend
          docker push gcr.io/$PROJECT_ID/vue-frontend:$GITHUB_SHA
          docker tag gcr.io/$PROJECT_ID/vue-frontend:$GITHUB_SHA gcr.io/$PROJECT_ID/vue-frontend:latest
          docker push gcr.io/$PROJECT_ID/vue-frontend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy trading-backend \
            --image gcr.io/$PROJECT_ID/trading-backend:$GITHUB_SHA \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars NODE_ENV=production
          
          gcloud run deploy angular-frontend \
            --image gcr.io/$PROJECT_ID/angular-frontend:$GITHUB_SHA \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated
          
          gcloud run deploy react-frontend \
            --image gcr.io/$PROJECT_ID/react-frontend:$GITHUB_SHA \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated
          
          gcloud run deploy vue-frontend \
            --image gcr.io/$PROJECT_ID/vue-frontend:$GITHUB_SHA \
            --region $GCP_REGION \
            --platform managed \
            --allow-unauthenticated
